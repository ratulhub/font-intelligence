name: Validate Font Intelligence

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Validate Catalog & Engine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fonttools

      - name: 1. Validate Catalog Schema & File References
        run: |
          python scripts/validate_catalog.py

      - name: 2. Validate Licensing & Commercial Permissions
        run: |
          python scripts/validate_licenses.py --filter issues-only

      - name: 3. Run Automated Unit Tests (Engine, CLI Tools & Domain Tests)
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          python -m unittest discover -s scripts -p "test_*.py"

      - name: 4. Run Real-User Evaluation Matrix (16 Cases + 8 Failure Cases)
        run: |
          python scripts/run_evaluation_matrix.py
